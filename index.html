<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVer風 番組表（パターンB深夜日跨ぎ対応版）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #e8ecf2;
      color: #1a1a1a;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* -----------------------------------
      左側サイドバー
    ----------------------------------- */
    .sidebar {
      width: 200px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 20px 15px;
      overflow-y: auto;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      padding-left: 5px;
    }
    .hamburger-icon { font-size: 20px; cursor: pointer; }
    .logo-text { font-size: 22px; font-weight: 900; color: #00a0e9; letter-spacing: -1px; }
    .logo-text span { font-size: 10px; background: #eee; padding: 2px 4px; border-radius: 3px; color: #333; margin-left: 2px; vertical-align: super; }

    .nav-list { list-style: none; margin-bottom: 30px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; font-size: 15px; font-weight: bold; color: #333; border-radius: 8px; text-decoration: none; }
    .nav-item:hover { background-color: #f5f5f5; }
    .nav-item svg { width: 20px; height: 20px; fill: none; stroke: #333; stroke-width: 2; }

    .category-title { font-size: 12px; color: #888; margin-bottom: 15px; padding-left: 10px; }
    .category-list { list-style: none; }
    .category-item { padding: 10px; font-size: 15px; font-weight: bold; color: #333; cursor: pointer; }
    .category-item:hover { color: #00a0e9; }

    /* -----------------------------------
      メインコンテンツエリア
    ----------------------------------- */
    .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-header { height: 60px; background-color: #e8ecf2; display: flex; align-items: center; justify-content: center; padding: 0 40px; flex-shrink: 0; }
    .search-box { width: 100%; max-width: 600px; position: relative; }
    .search-input { width: 100%; padding: 10px 15px 10px 40px; border-radius: 8px; border: none; background-color: #dbe0e8; font-size: 14px; outline: none; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #666; }

    .content-area { flex-grow: 1; display: flex; flex-direction: column; padding: 0 30px 20px 30px; overflow: hidden; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; flex-shrink: 0; }
    .page-title { font-size: 22px; font-weight: bold; }

    /* 日付選択タブ */
    .date-tabs { display: flex; gap: 8px; margin-top: 8px; }
    .date-btn { padding: 6px 14px; font-size: 14px; font-weight: bold; border: 1px solid #ccc; background: #fff; border-radius: 20px; cursor: pointer; }
    .date-btn.active { background: #00a0e9; color: #fff; border-color: #00a0e9; }

    /* -----------------------------------
      番組表（タイムテーブル）グリッド
    ----------------------------------- */
    .timetable-wrapper {
      flex-grow: 1;
      background-color: #ffffff;
      border: 1px solid #d0d0d0;
      display: flex;
      overflow: auto; /* 縦横方向のスクロール対応 */
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* 時間軸（左側固定列） */
    .time-sidebar { width: 50px; background-color: #4a515a; color: #ffffff; flex-shrink: 0; position: sticky; left: 0; z-index: 10; }
    .time-sidebar-header { height: 40px; background-color: #383e45; border-bottom: 1px solid #5a626c; }
    .time-hour-cell { height: 180px; border-bottom: 1px solid #5a626c; display: flex; flex-direction: column; align-items: center; padding-top: 10px; font-weight: bold; font-size: 13px; box-sizing: border-box; }
    .time-hour-cell span { font-size: 10px; color: #ccc; }

    /* チャンネル列コンテナ */
    .channels-wrapper { display: flex; flex-grow: 1; }
    .channel-column { width: 170px; flex-shrink: 0; border-right: 1px solid #d0d0d0; }
    .channel-header { height: 40px; background-color: #ffffff; border-bottom: 1px solid #d0d0d0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: #222; position: sticky; top: 0; z-index: 5; }
    .program-canvas { position: relative; }

    /* 番組カード */
    .program-card { position: absolute; width: 100%; padding: 6px 8px; border-bottom: 1px solid rgba(0, 0, 0, 0.12); font-size: 11px; line-height: 1.35; overflow: hidden; cursor: pointer; box-sizing: border-box; }
    .program-card:hover { filter: brightness(0.96); }
    .program-time-title { font-weight: bold; color: #111; margin-bottom: 4px; word-break: break-all; }
    .program-time-title .minute { font-size: 12px; font-weight: 900; margin-right: 3px; }
    .program-desc { color: #444; font-size: 10.5px; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>

  <!-- 左サイドバー -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="hamburger-icon">☰</div>
      <div class="logo-text">TVer <span>10th</span></div>
    </div>
    <ul class="nav-list">
      <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>ホーム</a>
      <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>マイページ</a>
      <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>さがす</a>
      <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>リアルタイム</a>
    </ul>
    <div class="category-title">カテゴリ</div>
    <ul class="category-list">
      <li class="category-item">ドラマ</li>
      <li class="category-item">バラエティ</li>
      <li class="category-item">アニメ</li>
      <li class="category-item">ニュース</li>
      <li class="category-item">スポーツ</li>
    </ul>
  </aside>

  <!-- メインエリア -->
  <div class="main-wrapper">
    <header class="top-header">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="番組名、出演者で検索">
      </div>
    </header>

    <main class="content-area">
      <div class="page-header">
        <div>
          <h1 class="page-title">番組表</h1>
          <div class="date-tabs" id="dateTabs"></div>
        </div>
      </div>

      <div class="timetable-wrapper">
        <div class="time-sidebar" id="timeSidebar">
          <div class="time-sidebar-header"></div>
        </div>
        <div class="channels-wrapper" id="channelsWrapper"></div>
      </div>
    </main>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyyTAarQNJNGTUOAdjIuXfWtdSBWRv2qGZ2_hfY7RAzd3ZiLWsbxhxTbMGMXpr11qba/exec";
    const PX_PER_MINUTE = 3; // 1分 = 3px (1時間 = 180px)

    // 動的カラーパレット（色かぶり防止用のテーマ色）
    const COLOR_PALETTE = [
      "#c4d7b5", "#d8cbeb", "#fcf4d9", "#bfe3c2", "#d0e8f2", "#fde2e4", "#e2ece9"
    ];

    let allPrograms = [];
    let selectedDate = "";
    let channelColorMap = {};

    fetch(GAS_API_URL)
      .then(res => res.json())
      .then(data => {
        allPrograms = data;
        initApp();
      })
      .catch(err => console.error("データ取得エラー:", err));

    function initApp() {
      // 1. 日付一覧を抽出してタブ化
      const dates = [...new Set(allPrograms.map(p => p.date))].sort();
      if (dates.length === 0) return;

      selectedDate = dates[0];
      renderDateTabs(dates);

      // 2. チャンネル毎に背景色を割り振る
      const channels = [...new Set(allPrograms.map(p => p.channel))];
      channels.forEach((ch, idx) => {
        channelColorMap[ch] = COLOR_PALETTE[idx % COLOR_PALETTE.length];
      });

      renderTimetable();
    }

    function renderDateTabs(dates) {
      const tabsContainer = document.getElementById("dateTabs");
      tabsContainer.innerHTML = "";

      dates.forEach(dateStr => {
        const btn = document.createElement("button");
        btn.className = `date-btn ${dateStr === selectedDate ? 'active' : ''}`;
        
        const [y, m, d] = dateStr.split('-');
        btn.innerText = `${parseInt(m)}月${parseInt(d)}日`;

        btn.onclick = () => {
          selectedDate = dateStr;
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderTimetable();
        };
        tabsContainer.appendChild(btn);
      });
    }

    // ★パターンB対応：時刻(HH:mm)を「開始日00:00からの通算分数」に変換する関数
    function parseTimeToMinutes(timeStr, isEnd = false, startMinutes = null) {
      let [h, m] = timeStr.split(':').map(Number);
      let total = h * 60 + m;

      // 終了時間で、開始時間より数値が小さい場合は「翌日扱い」で24時間(1440分)を足す
      if (isEnd && startMinutes !== null && total < startMinutes) {
        total += 24 * 60;
      }
      return total;
    }

    function renderTimetable() {
      const dayPrograms = allPrograms.filter(p => p.date === selectedDate);
      if (dayPrograms.length === 0) return;

      let minMinutes = 24 * 60;
      let maxMinutes = 0;

      // 日付内の最小時間と最大時間を自動検出
      dayPrograms.forEach(p => {
        const startMin = parseTimeToMinutes(p.startTime);
        const endMin = parseTimeToMinutes(p.endTime, true, startMin);

        if (startMin < minMinutes) minMinutes = startMin;
        if (endMin > maxMinutes) maxMinutes = endMin;
      });

      const minHour = Math.floor(minMinutes / 60);
      const maxHour = Math.ceil(maxMinutes / 60);

      const startBaseMinutes = minHour * 60;
      const totalHours = maxHour - minHour;
      const canvasHeight = totalHours * 180;

      // --- 1. 時間軸（左側）の動的生成 ---
      const sidebar = document.getElementById("timeSidebar");
      sidebar.innerHTML = '<div class="time-sidebar-header"></div>';
      for (let h = minHour; h < maxHour; h++) {
        const hourCell = document.createElement("div");
        hourCell.className = "time-hour-cell";
        
        // 24時を超えた場合は「24(0)時」「25(1)時」のように分かりやすく表示
        const displayHour = h >= 24 ? `${h} (${h - 24})` : h;
        hourCell.innerHTML = `${displayHour} <span>時</span>`;
        sidebar.appendChild(hourCell);
      }

      // --- 2. チャンネル列と番組カードの動的描画 ---
      const wrapper = document.getElementById("channelsWrapper");
      wrapper.innerHTML = "";
      const channels = [...new Set(dayPrograms.map(p => p.channel))];

      channels.forEach(ch => {
        const col = document.createElement("div");
        col.className = "channel-column";

        const header = document.createElement("div");
        header.className = "channel-header";
        header.innerText = ch;
        col.appendChild(header);

        const canvas = document.createElement("div");
        canvas.className = "program-canvas";
        canvas.style.height = `${canvasHeight}px`;

        const chPrograms = dayPrograms.filter(p => p.channel === ch);
        chPrograms.forEach(p => {
          const card = createProgramCard(p, startBaseMinutes, channelColorMap[ch]);
          if (card) canvas.appendChild(card);
        });

        col.appendChild(canvas);
        wrapper.appendChild(col);
      });
    }

    function createProgramCard(p, startBaseMinutes, bgColor) {
      const startTotal = parseTimeToMinutes(p.startTime);
      const endTotal = parseTimeToMinutes(p.endTime, true, startTotal);

      // 高さ(height)とY軸位置(top)の計算
      const topPx = (startTotal - startBaseMinutes) * PX_PER_MINUTE;
      const heightPx = (endTotal - startTotal) * PX_PER_MINUTE;

      const card = document.createElement("div");
      card.className = "program-card";
      card.style.top = `${topPx}px`;
      card.style.height = `${heightPx}px`;
      card.style.backgroundColor = bgColor;

      const [, sM] = p.startTime.split(':');
      const minuteStr = String(sM).padStart(2, '0');

      card.innerHTML = `
        <div class="program-time-title">
          <span class="minute">${minuteStr}</span>${p.title}
        </div>
        <div class="program-desc">${p.description || ''}</div>
      `;

      return card;
    }
  </script>
</body>
</html>
